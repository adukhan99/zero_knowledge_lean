name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Builds every library and executable. The `#guard` vectors in
      # test/ZkLeanTests/Vectors.lean are evaluated during this step, so a
      # regression in SHA-256 or the Merkle construction fails the build.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "zklean zklean-tamper ZkLeanTests"

      # An independent Lean 4 kernel, in Rust. It is what makes the export
      # tests meaningful: without it they only check that we agree with
      # ourselves. Pinned to a commit so a breaking change upstream shows up
      # as a deliberate bump rather than a mystery failure.
      - name: Build the independent kernel (nanoda_lib)
        run: |
          git clone https://github.com/ammkrn/nanoda_lib /tmp/nanoda
          cd /tmp/nanoda && git checkout 0505569 && cargo build --release

      - name: Portable verifier self-test
        run: python3 zklean/zklean.py selftest

      - name: End-to-end suite (seal, check, export, cross-check, reject)
        run: ./test/run.py
        env:
          ZKLEAN_NANODA: /tmp/nanoda/target/release/nanoda_bin
      # zkPi is deliberately not built in CI: it needs a 2023 Rust nightly and
      # builds GMP from source, which is slow and brittle. The legacy-format
      # tests validate structurally without it; set ZKLEAN_ZKPI locally to add
      # the cross-check.
